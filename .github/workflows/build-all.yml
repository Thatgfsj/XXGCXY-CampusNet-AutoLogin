name: Build All Platforms Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================
  # Windows (依赖系统 PowerShell 5.1+, 不再内置 PS7)
  # v1.9.0+ 重大变更: LFS object 丢失, 取消内置 PowerShell 7 便携版
  # Windows 10/11 自带 PS 5.1, DPAPI ProtectedData 在 .NET 4.x 可用
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Remove _pw7_ directory if present (历史残留)
        shell: pwsh
        run: |
          $pw7Paths = @(
            ".\_pw7_",
            ".\src-tauri\bin\_pw7_"
          )
          foreach ($p in $pw7Paths) {
            if (Test-Path $p) {
              Remove-Item -Recurse -Force $p
              Write-Host "Removed legacy: $p"
            }
          }

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  # ============================================
  # Linux: deb + tar.gz + rpm
  # ============================================
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (WebKit + rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            alien \
            rpm \
            fakeroot

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Create Linux packages
        run: |
          APP_VERSION="1.8.3"
          mkdir -p release/linux

          # Copy deb package
          cp src-tauri/target/release/bundle/deb/*.deb release/linux/

          # Create tar.gz package
          BINARY_NAME="xxgcxy-wifi"
          TAR_DIR="xxgcxy-wifi-v${APP_VERSION}-linux-x64"
          mkdir -p "release/linux/${TAR_DIR}"

          # Copy binary and scripts
          if [ -f "src-tauri/target/release/${BINARY_NAME}" ]; then
            cp "src-tauri/target/release/${BINARY_NAME}" "release/linux/${TAR_DIR}/"
          fi
          # Copy shell script
          cp xywdl.sh "release/linux/${TAR_DIR}/"
          chmod +x "release/linux/${TAR_DIR}/xywdl.sh"

          # Create tar.gz
          cd release/linux
          tar -czf "xxgcxy-wifi-v${APP_VERSION}-x86_64-linux.tar.gz" "${TAR_DIR}/"
          rm -rf "${TAR_DIR}"
          cd ../..

          # Convert deb to rpm (needs alien)
          cd src-tauri/target/release/bundle/deb/
          DEB_FILE=$(ls *.deb | head -1)
          if [ -n "$DEB_FILE" ]; then
            fakeroot alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            echo "rpm conversion failed (skipping)"
          fi
          cd ../../../../..

          # Copy rpm package (if generated successfully)
          if ls src-tauri/target/release/bundle/deb/*.rpm 1>/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/deb/*.rpm release/linux/
          fi

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/linux/*.deb

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-gz
          path: release/linux/*.tar.gz

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: release/linux/*.rpm

  # ============================================
  # 发布独立 sh 脚本
  # ============================================
  build-standalone-sh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Package standalone sh script
        run: |
          mkdir -p release/standalone-sh
          cp xywdl.sh release/standalone-sh/
          chmod +x release/standalone-sh/xywdl.sh

      - name: Upload standalone sh
        uses: actions/upload-artifact@v4
        with:
          name: standalone-sh
          path: release/standalone-sh/xywdl.sh

  # ============================================
  # 创建统一 Release
  # ============================================
  # v1.9.0 调试阶段临时禁用,只跑构建,回头手动发布
  release:
    if: ${{ true }}  # v1.9.0 正式发布启用
    needs: [build-windows, build-linux, build-standalone-sh]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows

      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/linux

      - name: Download Linux tar.gz
        uses: actions/download-artifact@v4
        with:
          name: linux-tar-gz
          path: artifacts/linux

      - name: Download Linux rpm
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: artifacts/linux

      - name: Download standalone sh
        uses: actions/download-artifact@v4
        with:
          name: standalone-sh
          path: artifacts/standalone-sh

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.0
          name: v1.9.0 - 校园网自动登录助手
          body: |
            v1.9.0 - 校园网自动登录助手

            ## 系统要求

            - **Windows 10/11**: 自带 PowerShell 5.1+ / .NET Framework 4.x
            - **Windows 7/8**: 需装 WMF 5.1（[下载](https://www.microsoft.com/en-us/download/details.aspx?id=54616)）
            - **Linux**: 需 pwsh 7+（[安装](https://learn.microsoft.com/powershell/scripting/install/installing-powershell-on-linux)）

            ## 下载

            **Windows (系统 PowerShell 5.1+, 体积小)**
            - `xxgcxy-wifi_1.9.0_x64-setup.exe` - NSIS installer (~5 MB)
            - `xxgcxy-wifi_1.9.0_x64_zh-CN.msi` - MSI installer (~6 MB)

            **Linux**
            - `xxgcxy-wifi_1.9.0_amd64.deb` - Debian/Ubuntu package
            - `xxgcxy-wifi-v1.9.0-x86_64-linux.tar.gz` - Generic Linux tarball
            - `xxgcxy-wifi-1.9.0-1.x86_64.rpm` - RPM package (converted from deb)

            **Cross-platform**
            - `xywdl.sh` - Standalone shell script (Linux/macOS, needs pwsh)

            ## What's New in v1.9.0

            ### 新功能 (Feat)
            - **登录模块解耦**: 改为 JSON 模板 (login_profile.json) + 渲染器模式
            - **可视化登录配置屏** (`#loginConfigScreen`): 运营商/学号/密码/Portal URL
            - **首次启动自动弹窗**: 未配置账号时强制弹登录配置屏
            - **设置页入口** ("更改账号信息" 按钮)
            - **Portal URL 一键解析**: 粘贴重定向 URL → 自动填充 SSID/AC/VLAN/MAC
            - **密码用 Windows DPAPI 加密** (login_credential.bin)

            ### 重构 (Refactor)
            - **xywdl.ps1** 从 604 行简化到 280 行 (-54%)
            - 移除交互式 Read-Host 和自动检测 portal 重定向
            - 配置从硬编码改为 JSON 模板

            ### 修复 (Fix)
            - 修复校园网配置读取路径
            - xywdl.bat 修复编码问题
            - 移除 Unix-only 的 `Permissions::from_mode` 调用，修复 Windows 编译
            - **urldecode UTF-8 多字节字符支持** (修复中文/emoji 乱码)
            - **前端 XSS 修复** (DOM API 替代 innerHTML)
            - **CI 编译错误修复** (url_decode_form 末尾多余变量)
            - 启动窗口行为修复 (没登录信息不隐藏，有则隐藏)

            ### 破坏性变更 (Breaking)
            - **不兼容** 旧的 `%APPDATA%\xxgc_campus_net_config.txt`
            - 首次启动需要重新配置账号

            ## 升级说明

            从 v1.8.x 升级：
            1. 备份旧配置：`%APPDATA%\xxgc_campus_net_config.txt` 中的学号和密码
            2. 安装 v1.9.0 安装包
            3. 启动后会看到登录配置屏，填入学号/密码/Portal URL
            4. WiFi 配置 (主网络/备用网络) 保留
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.msi
            artifacts/linux/*.deb
            artifacts/linux/*.tar.gz
            artifacts/linux/*.rpm
            artifacts/standalone-sh/*.sh
