name: Build All Platforms Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  # ============================================
  # Windows (依赖系统 PowerShell 5.1+, 不再内置 PS7)
  # v1.9.0+ 重大变更: LFS object 丢失, 取消内置 PowerShell 7 便携版
  # Windows 10/11 自带 PS 5.1, DPAPI ProtectedData 在 .NET 4.x 可用
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Remove _pw7_ directory if present (历史残留)
        shell: pwsh
        run: |
          $pw7Paths = @(
            ".\_pw7_",
            ".\src-tauri\bin\_pw7_"
          )
          foreach ($p in $pw7Paths) {
            if (Test-Path $p) {
              Remove-Item -Recurse -Force $p
              Write-Host "Removed legacy: $p"
            }
          }

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  # ============================================
  # Linux: deb + tar.gz + rpm
  # ============================================
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (WebKit + rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            alien \
            rpm \
            fakeroot

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Create Linux packages
        run: |
          APP_VERSION="2.0.4"
          mkdir -p release/linux

          # Copy deb package
          cp src-tauri/target/release/bundle/deb/*.deb release/linux/

          # Create tar.gz package
          BINARY_NAME="xxgcxy-wifi"
          TAR_DIR="xxgcxy-wifi-v${APP_VERSION}-linux-x64"
          mkdir -p "release/linux/${TAR_DIR}"

          # Copy binary and scripts
          if [ -f "src-tauri/target/release/${BINARY_NAME}" ]; then
            cp "src-tauri/target/release/${BINARY_NAME}" "release/linux/${TAR_DIR}/"
          fi
          # Copy shell script
          cp xywdl.sh "release/linux/${TAR_DIR}/"
          chmod +x "release/linux/${TAR_DIR}/xywdl.sh"

          # Create tar.gz
          cd release/linux
          tar -czf "xxgcxy-wifi-v${APP_VERSION}-x86_64-linux.tar.gz" "${TAR_DIR}/"
          rm -rf "${TAR_DIR}"
          cd ../..

          # Convert deb to rpm (needs alien)
          cd src-tauri/target/release/bundle/deb/
          DEB_FILE=$(ls *.deb | head -1)
          if [ -n "$DEB_FILE" ]; then
            fakeroot alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            echo "rpm conversion failed (skipping)"
          fi
          cd ../../../../..

          # Copy rpm package (if generated successfully)
          if ls src-tauri/target/release/bundle/deb/*.rpm 1>/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/deb/*.rpm release/linux/
          fi

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/linux/*.deb

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-gz
          path: release/linux/*.tar.gz

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: release/linux/*.rpm

  # ============================================
  # 发布独立 sh 脚本
  # ============================================
  build-standalone-sh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Package standalone sh script
        run: |
          mkdir -p release/standalone-sh
          cp xywdl.sh release/standalone-sh/
          chmod +x release/standalone-sh/xywdl.sh

      - name: Upload standalone sh
        uses: actions/upload-artifact@v4
        with:
          name: standalone-sh
          path: release/standalone-sh/xywdl.sh

  # ============================================
  # 创建统一 Release
  # ============================================
  # v1.9.0 调试阶段临时禁用,只跑构建,回头手动发布
  release:
    if: ${{ true }}  # v1.9.0 正式发布启用
    needs: [build-windows, build-linux, build-standalone-sh]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows

      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/linux

      - name: Download Linux tar.gz
        uses: actions/download-artifact@v4
        with:
          name: linux-tar-gz
          path: artifacts/linux

      - name: Download Linux rpm
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: artifacts/linux

      - name: Download standalone sh
        uses: actions/download-artifact@v4
        with:
          name: standalone-sh
          path: artifacts/standalone-sh

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.9
          name: v2.0.9 - 校园网自动登录助手
          make_latest: true
          body: |
            v2.0.9 - 校园网自动登录助手

            ## 系统要求

            - **Windows 10/11**: 自带 PowerShell 5.1+ / .NET Framework 4.x
            - **Windows 7/8**: 需装 WMF 5.1（[下载](https://www.microsoft.com/en-us/download/details.aspx?id=54616)）
            - **Linux**: 需 curl 或 python3（[安装](https://www.python.org/downloads/)）

            ## 下载

            **Windows (系统 PowerShell 5.1+, 体积小)**
            - `xxgcxy-wifi_2.0.9_x64-setup.exe` - NSIS installer (~5 MB)
            - `xxgcxy-wifi_2.0.9_x64_zh-CN.msi` - MSI installer (~6 MB)

            **Linux**
            - `xxgcxy-wifi_2.0.9_amd64.deb` - Debian/Ubuntu package
            - `xxgcxy-wifi-v2.0.9-x86_64-linux.tar.gz` - Generic Linux tarball
            - `xxgcxy-wifi-2.0.9-1.x86_64.rpm` - RPM package (converted from deb)

            **Cross-platform**
            - `xywdl.sh` - Standalone shell script (Linux/macOS, needs curl or python3)

            ## What's New in v2.0.9

            ### ⚡ 认证极速响应与卡死假死彻底根治 (Speed & Responsiveness)
            - **模拟主流浏览器标头 (防 AC/WAF 掐线)**: 认证请求（PowerShell / C# / Python 三层）统一注入标准 Chrome 浏览器标头与中文语言环境，彻底解决校园网 AC/WAF 防火墙误判并重置连接（“基础连接已经关闭: 连接被意外关闭” / “Remote end closed connection without response”）的问题，实现与浏览器手动登录相同的秒级连通。
            - **内网超时从 30s 缩短至 6s**: 针对校园网内网环境，单层超时收紧至 6 秒，彻底消除原三层降级累加长达 90 秒的假死与两分钟无法联网问题。
            - **解除前端 30 秒全局死锁**: 移除前端登录后粗暴的 30 秒阻塞锁，登录完成立即释放状态，用户点击“立即检测并重连”秒级响应，告别“一分钟没反应一直不动”。
            - **日志防抖与 SSID 容错**: 消除多重“重连后需要登录校园网...”冗余日志，SSID 匹配全面兼容大小写，心跳定时器智能自适应。

            ## What's New in v2.0.8

            ### 🔥 保持移动热点开启守护 (Hotspot Keep-Alive)
            - **突破校园网单账号限制**: 针对校园网单设备在线限制，学生使用电脑开启热点共享上网时，解决 Windows 默认因无设备连接而自动休眠关闭热点的痛点。
            - **原生 WinRT 守护机制**: 采用 Windows 原生 WinRT API 实时探测并拉起热点，断线重连认证后联动恢复，保持数据连接永不断线。

            ### 🎨 客户端 UI 深度重构 (Dark Acrylic Glassmorphism)
            - **深色极客毛玻璃视效**: 采用深空流光微粒背景、24px 高斯模糊磨砂亚克力面板、超细 1px 微光边框。
            - **动态网络雷达环 (Hero Gauge)**: 140px 发光动态仪表盘，在线/待登录/掉线/检测中状态呼吸变色，直观醒目。
            - **学生身份名片 (Profile Card)**: 专属科技感头像、学号展示、移动/联通/电信专属品牌微光标签与一键更改抽屉。
            - **精炼与安全优化**: 移除冗余的“保存并登录”按钮，默认窗口优化为 460×800 并设置最小约束，输入框示例参数全面脱敏匿名化。
            - **智能滑动开关 & 胶囊操作**: 扁平化无缝滑动开关与微光悬浮按键。
            - **可折叠活动时间轴 (Activity Terminal)**: 终端等宽字体，支持 `[+]` 绿标、`[!]` 红标、`[*]` 蓝标语义化高亮。

            ### 🚀 稳定性与体验深度加固 (User Experience Fixes)
            - **支持字母账号 (补卡/工号无忧)**: 解除纯数字限制，完美支持字母与数字组合（如补卡后缀 `ls` / `lls`、前缀字母学号），输入误含 `@` 自动智能剥离。
            - **开机自启彻底静默保活**: 注册表注入 `--autostart` 标志且初始窗口不可见，电脑开机重启后绝对静默驻留系统托盘，彻底告别弹窗打扰。

            ## 升级说明

            从旧版本升级：
            1. 直接下载安装最新的 v2.0.9 安装包覆盖安装即可
            2. 现有账号与 WiFi 配置自动保留
            3. 若之前遇到连接过慢、卡在待认证或被意外掐线，升级后即可极速恢复秒登
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.msi
            artifacts/linux/*.deb
            artifacts/linux/*.tar.gz
            artifacts/linux/*.rpm
            artifacts/standalone-sh/*.sh
