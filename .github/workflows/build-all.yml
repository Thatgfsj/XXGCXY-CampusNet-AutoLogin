name: Build All Platforms Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  # ============================================
  # 测试 (独立于发布链, 不阻塞产物构建)
  # ============================================
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (WebKit)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev

      - name: Build frontend (tauri codegen 依赖 dist)
        run: npm run build

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint shell scripts
        run: bash -n xywdl.sh tests/test_sh_judge.sh

      - name: Compile-check python helpers
        run: |
          python3 -m py_compile tests/mock_portal.py
          python3 -m py_compile src/sender/sender.py

      - name: Run sh judge tests
        run: bash tests/test_sh_judge.sh

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build frontend (tauri codegen 依赖 dist)
        run: npm run build

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Run PowerShell login-script test suite
        shell: pwsh
        run: ./tests/run_ps1_tests.ps1

  # ============================================
  # Windows (依赖系统 PowerShell 5.1+, 不再内置 PS7)
  # v1.9.0+ 重大变更: LFS object 丢失, 取消内置 PowerShell 7 便携版
  # Windows 10/11 自带 PS 5.1, DPAPI ProtectedData 在 .NET 4.x 可用
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 不指定 ref: 默认检出触发事件对应的 ref —— 此前写死 ref: main,
        # tag 触发时构建的也是 main HEAD, 产物可能与 tag 指向的代码不一致

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.lock
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Remove _pw7_ directory if present (历史残留)
        shell: pwsh
        run: |
          $pw7Paths = @(
            ".\_pw7_",
            ".\src-tauri\bin\_pw7_"
          )
          foreach ($p in $pw7Paths) {
            if (Test-Path $p) {
              Remove-Item -Recurse -Force $p
              Write-Host "Removed legacy: $p"
            }
          }

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  # ============================================
  # Linux: deb + tar.gz + rpm
  # ============================================
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (WebKit + rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            alien \
            rpm \
            fakeroot

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Create Linux packages
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          mkdir -p release/linux

          # Copy deb package
          cp src-tauri/target/release/bundle/deb/*.deb release/linux/

          # Create tar.gz package
          TAR_DIR="xxgcxy-wifi-v${APP_VERSION}-linux-x64"
          mkdir -p "release/linux/${TAR_DIR}"

          # Copy binary and scripts
          for b in xxgcxy-wifi; do
            if [ -f "src-tauri/target/release/${b}" ]; then
              cp "src-tauri/target/release/${b}" "release/linux/${TAR_DIR}/"
            fi
          done
          # Copy shell script
          cp xywdl.sh "release/linux/${TAR_DIR}/"
          chmod +x "release/linux/${TAR_DIR}/xywdl.sh"

          # Create tar.gz
          cd release/linux
          tar -czf "xxgcxy-wifi-v${APP_VERSION}-x86_64-linux.tar.gz" "${TAR_DIR}/"
          rm -rf "${TAR_DIR}"
          cd ../..

          # Convert deb to rpm (needs alien)
          cd src-tauri/target/release/bundle/deb/
          DEB_FILE=$(ls *.deb | head -1)
          if [ -n "$DEB_FILE" ]; then
            fakeroot alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            echo "rpm conversion failed (skipping)"
          fi
          cd ../../../../..

          # Copy rpm package (if generated successfully)
          if ls src-tauri/target/release/bundle/deb/*.rpm 1>/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/deb/*.rpm release/linux/
          fi

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/linux/*.deb

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-gz
          path: release/linux/*.tar.gz

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: release/linux/*.rpm

  # ============================================
  # 发布独立 sh 脚本
  # ============================================
  build-standalone-sh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package standalone sh script
        run: |
          mkdir -p release/standalone-sh
          cp xywdl.sh release/standalone-sh/
          chmod +x release/standalone-sh/xywdl.sh

      - name: Upload standalone sh
        uses: actions/upload-artifact@v4
        with:
          name: standalone-sh
          path: release/standalone-sh/xywdl.sh

  # ============================================
  # 创建统一 Release
  # main 推送与 tag 推送都会发版: tag 触发用 tag 名, 否则用 package.json 版本算 v{VERSION}
  # ============================================
  release:
    if: ${{ true }}
    needs: [build-windows, build-linux, build-standalone-sh]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Tag and Version
        id: vars
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows

      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/linux

      - name: Download Linux tar.gz
        uses: actions/download-artifact@v4
        with:
          name: linux-tar-gz
          path: artifacts/linux

      - name: Download Linux rpm
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: artifacts/linux

      - name: Download standalone sh
        uses: actions/download-artifact@v4
        with:
          name: standalone-sh
          path: artifacts/standalone-sh

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find artifacts -type f

      - name: Generate Release Notes
        run: |
          python3 .github/scripts/generate_release_notes.py "${{ steps.vars.outputs.version }}" "${{ steps.vars.outputs.tag_name }}" artifacts/RELEASE_NOTES.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.tag_name }} - 校园网自动登录助手
          make_latest: true
          body_path: artifacts/RELEASE_NOTES.md
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.msi
            artifacts/linux/*.deb
            artifacts/linux/*.tar.gz
            artifacts/linux/*.rpm
            artifacts/standalone-sh/*.sh
