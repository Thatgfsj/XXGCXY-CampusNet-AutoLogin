name: Build All Platforms Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--no-deprecation"

jobs:
  # ============================================
  # Windows (依赖系统 PowerShell 5.1+, 不再内置 PS7)
  # v1.9.0+ 重大变更: LFS object 丢失, 取消内置 PowerShell 7 便携版
  # Windows 10/11 自带 PS 5.1, DPAPI ProtectedData 在 .NET 4.x 可用
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Remove _pw7_ directory if present (历史残留)
        shell: pwsh
        run: |
          $pw7Paths = @(
            ".\_pw7_",
            ".\src-tauri\bin\_pw7_"
          )
          foreach ($p in $pw7Paths) {
            if (Test-Path $p) {
              Remove-Item -Recurse -Force $p
              Write-Host "Removed legacy: $p"
            }
          }

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  # ============================================
  # Linux: deb + tar.gz + rpm
  # ============================================
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (WebKit + rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            alien \
            rpm \
            fakeroot

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Create Linux packages
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          mkdir -p release/linux

          # Copy deb package
          cp src-tauri/target/release/bundle/deb/*.deb release/linux/

          # Create tar.gz package
          TAR_DIR="xxgcxy-wifi-v${APP_VERSION}-linux-x64"
          mkdir -p "release/linux/${TAR_DIR}"

          # Copy binary and scripts
          for b in xxgcxy-wifi campus-wifi-helper; do
            if [ -f "src-tauri/target/release/${b}" ]; then
              cp "src-tauri/target/release/${b}" "release/linux/${TAR_DIR}/"
            fi
          done
          # Copy shell script
          cp xywdl.sh "release/linux/${TAR_DIR}/"
          chmod +x "release/linux/${TAR_DIR}/xywdl.sh"

          # Create tar.gz
          cd release/linux
          tar -czf "xxgcxy-wifi-v${APP_VERSION}-x86_64-linux.tar.gz" "${TAR_DIR}/"
          rm -rf "${TAR_DIR}"
          cd ../..

          # Convert deb to rpm (needs alien)
          cd src-tauri/target/release/bundle/deb/
          DEB_FILE=$(ls *.deb | head -1)
          if [ -n "$DEB_FILE" ]; then
            fakeroot alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            echo "rpm conversion failed (skipping)"
          fi
          cd ../../../../..

          # Copy rpm package (if generated successfully)
          if ls src-tauri/target/release/bundle/deb/*.rpm 1>/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/deb/*.rpm release/linux/
          fi

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/linux/*.deb

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-gz
          path: release/linux/*.tar.gz

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: release/linux/*.rpm

  # ============================================
  # 发布独立 sh 脚本
  # ============================================
  build-standalone-sh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Package standalone sh script
        run: |
          mkdir -p release/standalone-sh
          cp xywdl.sh release/standalone-sh/
          chmod +x release/standalone-sh/xywdl.sh

      - name: Upload standalone sh
        uses: actions/upload-artifact@v4
        with:
          name: standalone-sh
          path: release/standalone-sh/xywdl.sh

  # ============================================
  # 创建统一 Release
  # ============================================
  # v1.9.0 调试阶段临时禁用,只跑构建,回头手动发布
  release:
    if: ${{ true }}  # v1.9.0 正式发布启用
    needs: [build-windows, build-linux, build-standalone-sh]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Tag and Version
        id: vars
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows

      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/linux

      - name: Download Linux tar.gz
        uses: actions/download-artifact@v4
        with:
          name: linux-tar-gz
          path: artifacts/linux

      - name: Download Linux rpm
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: artifacts/linux

      - name: Download standalone sh
        uses: actions/download-artifact@v4
        with:
          name: standalone-sh
          path: artifacts/standalone-sh

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.tag_name }} - 校园网自动登录助手
          make_latest: true
          body: |
            ${{ steps.vars.outputs.tag_name }} - 校园网自动登录助手

            ## 系统要求

            - **Windows 10/11**: 自带 PowerShell 5.1+ / .NET Framework 4.x
            - **Windows 7/8**: 需装 WMF 5.1（[下载](https://www.microsoft.com/en-us/download/details.aspx?id=54616)）
            - **Linux**: 需 curl 或 python3（[安装](https://www.python.org/downloads/)）

            ## 下载

            **Windows (系统 PowerShell 5.1+, 体积小)**
            - `xxgcxy-wifi_${{ steps.vars.outputs.version }}_x64-setup.exe` - NSIS 安装包 (~5 MB)
            - `xxgcxy-wifi_${{ steps.vars.outputs.version }}_x64_zh-CN.msi` - MSI 安装包 (~6 MB)

            **Linux**
            - `xxgcxy-wifi_${{ steps.vars.outputs.version }}_amd64.deb` - Debian/Ubuntu 软件包
            - `xxgcxy-wifi-v${{ steps.vars.outputs.version }}-x86_64-linux.tar.gz` - 通用 Linux 压缩包
            - `xxgcxy-wifi-${{ steps.vars.outputs.version }}-1.x86_64.rpm` - RPM 软件包

            **Cross-platform**
            - `xywdl.sh` - 独立 Shell 脚本 (Linux/macOS, 需要 curl 或 python3)

            ## 升级说明

            从旧版本升级：
            1. 直接下载安装最新的安装包覆盖安装即可
            2. 现有账号与 WiFi 配置自动保留
            3. 若之前遇到连接过慢、卡在待认证或被意外掐线，升级后即可极速恢复秒登
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.msi
            artifacts/linux/*.deb
            artifacts/linux/*.tar.gz
            artifacts/linux/*.rpm
            artifacts/standalone-sh/*.sh
