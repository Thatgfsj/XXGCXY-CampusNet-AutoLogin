name: Build All Platforms Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================
  # Windows (依赖系统 PowerShell 5.1+, 不再内置 PS7)
  # v1.9.0+ 重大变更: LFS object 丢失, 取消内置 PowerShell 7 便携版
  # Windows 10/11 自带 PS 5.1, DPAPI ProtectedData 在 .NET 4.x 可用
  # ============================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Remove _pw7_ directory if present (历史残留)
        shell: pwsh
        run: |
          $pw7Paths = @(
            ".\_pw7_",
            ".\src-tauri\bin\_pw7_"
          )
          foreach ($p in $pw7Paths) {
            if (Test-Path $p) {
              Remove-Item -Recurse -Force $p
              Write-Host "Removed legacy: $p"
            }
          }

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Upload NSIS
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi

  # ============================================
  # Linux: deb + tar.gz + rpm
  # ============================================
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (WebKit + rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            alien \
            rpm \
            fakeroot

      - name: Build Tauri
        run: npx @tauri-apps/cli build

      - name: Create Linux packages
        run: |
          APP_VERSION="2.0.1"
          mkdir -p release/linux

          # Copy deb package
          cp src-tauri/target/release/bundle/deb/*.deb release/linux/

          # Create tar.gz package
          BINARY_NAME="xxgcxy-wifi"
          TAR_DIR="xxgcxy-wifi-v${APP_VERSION}-linux-x64"
          mkdir -p "release/linux/${TAR_DIR}"

          # Copy binary and scripts
          if [ -f "src-tauri/target/release/${BINARY_NAME}" ]; then
            cp "src-tauri/target/release/${BINARY_NAME}" "release/linux/${TAR_DIR}/"
          fi
          # Copy shell script
          cp xywdl.sh "release/linux/${TAR_DIR}/"
          chmod +x "release/linux/${TAR_DIR}/xywdl.sh"

          # Create tar.gz
          cd release/linux
          tar -czf "xxgcxy-wifi-v${APP_VERSION}-x86_64-linux.tar.gz" "${TAR_DIR}/"
          rm -rf "${TAR_DIR}"
          cd ../..

          # Convert deb to rpm (needs alien)
          cd src-tauri/target/release/bundle/deb/
          DEB_FILE=$(ls *.deb | head -1)
          if [ -n "$DEB_FILE" ]; then
            fakeroot alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            alien --to-rpm --keep-version "$DEB_FILE" 2>/dev/null || \
            echo "rpm conversion failed (skipping)"
          fi
          cd ../../../../..

          # Copy rpm package (if generated successfully)
          if ls src-tauri/target/release/bundle/deb/*.rpm 1>/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/deb/*.rpm release/linux/
          fi

      - name: Upload Linux deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: release/linux/*.deb

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-gz
          path: release/linux/*.tar.gz

      - name: Upload Linux rpm
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: release/linux/*.rpm

  # ============================================
  # 发布独立 sh 脚本
  # ============================================
  build-standalone-sh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Package standalone sh script
        run: |
          mkdir -p release/standalone-sh
          cp xywdl.sh release/standalone-sh/
          chmod +x release/standalone-sh/xywdl.sh

      - name: Upload standalone sh
        uses: actions/upload-artifact@v4
        with:
          name: standalone-sh
          path: release/standalone-sh/xywdl.sh

  # ============================================
  # 创建统一 Release
  # ============================================
  # v1.9.0 调试阶段临时禁用,只跑构建,回头手动发布
  release:
    if: ${{ true }}  # v1.9.0 正式发布启用
    needs: [build-windows, build-linux, build-standalone-sh]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows NSIS
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download Windows MSI
        uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: artifacts/windows

      - name: Download Linux deb
        uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: artifacts/linux

      - name: Download Linux tar.gz
        uses: actions/download-artifact@v4
        with:
          name: linux-tar-gz
          path: artifacts/linux

      - name: Download Linux rpm
        uses: actions/download-artifact@v4
        with:
          name: linux-rpm
          path: artifacts/linux

      - name: Download standalone sh
        uses: actions/download-artifact@v4
        with:
          name: standalone-sh
          path: artifacts/standalone-sh

      - name: List artifacts
        run: |
          echo "=== Artifacts ==="
          find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: v2.0.1 - 校园网自动登录助手
          body: |
            v2.0.1 - 校园网自动登录助手

            ## 系统要求

            - **Windows 10/11**: 自带 PowerShell 5.1+ / .NET Framework 4.x
            - **Windows 7/8**: 需装 WMF 5.1（[下载](https://www.microsoft.com/en-us/download/details.aspx?id=54616)）
            - **Linux**: 需 curl 或 python3（[安装](https://www.python.org/downloads/)）

            ## 下载

            **Windows (系统 PowerShell 5.1+, 体积小)**
            - `xxgcxy-wifi_2.0.1_x64-setup.exe` - NSIS installer (~5 MB)
            - `xxgcxy-wifi_2.0.1_x64_zh-CN.msi` - MSI installer (~6 MB)

            **Linux**
            - `xxgcxy-wifi_2.0.1_amd64.deb` - Debian/Ubuntu package
            - `xxgcxy-wifi-v2.0.1-x86_64-linux.tar.gz` - Generic Linux tarball
            - `xxgcxy-wifi-2.0.1-1.x86_64.rpm` - RPM package (converted from deb)

            **Cross-platform**
            - `xywdl.sh` - Standalone shell script (Linux/macOS, needs curl or python3)

            ## What's New in v2.0.1

            ### 修复 (Fix)
            - **修复登录无法使用**: MAC 地址留空被误判为"缺少字段"而拒绝登录 (根因 bug)
            - **修复 PS 管道双 BOM**: 发送 URL 到 C#/Python 保底层时开头多出 BOM 字符
            - **修复 Portal URL 解析按钮连点报错**: 加防重复点击锁

            ### 新功能 (Feat)
            - **请求发送三层降级** (Windows): PowerShell → C# sender → Python sender
            - **请求发送两层降级** (Linux): curl → Python sender
            - **跨平台最强保底**: 纯标准库 Python sender (src/sender/sender.py)
            - **C# 保底发送器**: 预编译 xywdl_sender.exe (5KB, .NET Framework 4.x)
            - 密码通过 stdin 管道传给保底层, 不进进程命令行

            ## 升级说明

            从 v1.9.x 升级：
            1. 直接安装 v2.0.1 安装包
            2. 现有账号/WiFi 配置保留
            3. 若之前因 MAC 留空无法登录, 升级后即可正常登录
          files: |
            artifacts/windows/*.exe
            artifacts/windows/*.msi
            artifacts/linux/*.deb
            artifacts/linux/*.tar.gz
            artifacts/linux/*.rpm
            artifacts/standalone-sh/*.sh
